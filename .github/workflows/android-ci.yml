name: Android CI
on:
  push:
    branches: [main, "feat/android-alpha-bootstrap"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      signed: ${{ steps.alpha_sign.outputs.signed }}
      apk_artifact: ${{ steps.compatibility_input.outputs.name }}
      version_code: ${{ steps.compatibility_input.outputs.version_code }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 12266719
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Check and build
        run: gradle --no-daemon :core:model:test :app:lintDebug :app:testDebugUnitTest :app:assembleDebug :core:database:lintDebug :core:database:assembleDebugAndroidTest :app:assembleDebugAndroidTest
      - name: Print generated Room schema for review
        run: find core/database/schemas -type f -name '*.json' -print -exec cat {} +
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: credivaro-check-reports
          path: |
            core/model/build/test-results/test/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
            core/database/build/reports/lint-results-debug.*
            core/database/schemas/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload temporary debug APK (clean installs only)
        uses: actions/upload-artifact@v4
        with:
          name: credivaro-v0.1.0-alpha-build9-temporary-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # Only sign from the maintainer's trusted branches, never from pull_request.
      - name: Sign alpha APK with persistent key
        id: alpha_sign
        if: github.repository == 'Ketarro/Credivaro' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/android-alpha-bootstrap')
        shell: bash
        env:
          ALPHA_KEYSTORE_B64: ${{ secrets.ALPHA_KEYSTORE_B64 }}
          ALPHA_KEYSTORE_PASSWORD: ${{ secrets.ALPHA_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$ALPHA_KEYSTORE_B64" && -z "$ALPHA_KEYSTORE_PASSWORD" ]]; then
            echo "::notice::Persistent alpha key is not configured. Only temporary debug APK is available."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$ALPHA_KEYSTORE_B64" || -z "$ALPHA_KEYSTORE_PASSWORD" ]]; then
            echo "::error::Incomplete alpha signing configuration."
            exit 1
          fi
          umask 077
          key_dir="$(mktemp -d "${RUNNER_TEMP}/credivaro-signing.XXXXXX")"
          trap 'rm -rf -- "$key_dir"' EXIT
          printf '%s' "$ALPHA_KEYSTORE_B64" | base64 --decode > "$key_dir/alpha.p12"
          unset ALPHA_KEYSTORE_B64
          apksigner="${ANDROID_HOME}/build-tools/35.0.0/apksigner"
          mkdir -p "$RUNNER_TEMP/credivaro-alpha"
          output="$RUNNER_TEMP/credivaro-alpha/credivaro-v0.1.0-alpha-build9.apk"
          "$apksigner" sign --ks "$key_dir/alpha.p12" --ks-type PKCS12 \
            --ks-key-alias credivaro-alpha --ks-pass env:ALPHA_KEYSTORE_PASSWORD \
            --key-pass env:ALPHA_KEYSTORE_PASSWORD --out "$output" \
            app/build/outputs/apk/debug/app-debug.apk
          verification="$("$apksigner" verify --verbose --print-certs "$output")"
          printf '%s\n' "$verification"
          expected_sha256="d26244a7cdf0207f6bf0f5c54ad557c89b2e1ae4357bb07ae070085de66c22c8"
          actual_sha256="$(printf '%s\n' "$verification" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          if [[ "$actual_sha256" != "$expected_sha256" ]]; then
            echo "::error::Alpha signing certificate differs from Build 4."
            exit 1
          fi
          (cd "$(dirname "$output")" && sha256sum "$(basename "$output")" > "$(basename "$output").sha256")
          echo "Alpha certificate matches Build 4."
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: Upload persistently signed alpha APK
        if: steps.alpha_sign.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: credivaro-v0.1.0-alpha-build9-signed
          path: |
            ${{ runner.temp }}/credivaro-alpha/credivaro-v0.1.0-alpha-build9.apk
            ${{ runner.temp }}/credivaro-alpha/credivaro-v0.1.0-alpha-build9.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Select APK for compatibility checks
        id: compatibility_input
        env:
          SIGNED: ${{ steps.alpha_sign.outputs.signed }}
        run: |
          set -euo pipefail
          if [[ "$SIGNED" == true ]]; then
            name=credivaro-v0.1.0-alpha-build9-signed
            apk="$RUNNER_TEMP/credivaro-alpha/credivaro-v0.1.0-alpha-build9.apk"
          else
            name=credivaro-v0.1.0-alpha-build9-temporary-debug
            apk=app/build/outputs/apk/debug/app-debug.apk
          fi
          badging="$("$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$apk")"
          version_code="$(printf '%s\n' "$badging" | grep "^package:" | grep -o "versionCode='[0-9]*'" | cut -d "'" -f 2)"
          test -n "$version_code"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          sha256sum "$apk"

  compatibility:
    name: Install and launch / API ${{ matrix.api }}
    needs: debug
    # Trusted branch runs exercise the actual signed distribution APK, not a rebuilt debug substitute.
    # PR builds continue to run JVM tests and lint without signing secrets.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 26
            target: default
            arch: x86
          - api: 28
            target: google_apis
            arch: x86
          - api: 29
            target: google_apis
            arch: x86
          - api: 30
            target: google_apis
            arch: x86
          - api: 36
            target: google_apis
            arch: x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 12266719
      - name: Install APK inspection tools
        run: sdkmanager "build-tools;35.0.0"
      - name: Download current run APK
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.debug.outputs.apk_artifact }}
          path: compatibility/current
      - name: Download exact distributed Build 8 for issue 6
        id: original
        if: needs.debug.outputs.version_code == '9'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: credivaro-v0.1.0-alpha-build8-signed
          repository: Ketarro/Credivaro
          run-id: 45325287905
          github-token: ${{ github.token }}
          path: compatibility/original
      - name: Prepare diagnostics
        env:
          SIGNED: ${{ needs.debug.outputs.signed }}
          ORIGINAL: ${{ steps.original.outcome }}
        run: |
          mkdir -p compatibility/reports
          printf 'current_signed=%s\noriginal_download=%s\n' "$SIGNED" "$ORIGINAL" > compatibility/reports/input.txt
          if [[ "$SIGNED" != true ]]; then
            echo "::warning::Current APK is temporary debug; this does not validate the persistent signer."
          fi
          if [[ "$ORIGINAL" == failure ]]; then
            echo "::warning::Exact original Build 8 artifact unavailable; only the current APK can be tested."
          fi
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch APK on emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          EXPECTED_API: ${{ matrix.api }}
          CURRENT_SIGNED: ${{ needs.debug.outputs.signed }}
          EXPECTED_VERSION_CODE: ${{ needs.debug.outputs.version_code }}
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash scripts/android-compatibility.sh
      - name: Upload compatibility diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: credivaro-compat-api-${{ matrix.api }}
          path: compatibility/reports/
          if-no-files-found: warn
          retention-days: 14

  storage:
    name: Encrypted storage prototype / API ${{ matrix.api }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 26
            target: default
            arch: x86
          - api: 36
            target: google_apis
            arch: x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 12266719
      - name: Install SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run isolated storage tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: gradle --no-daemon :core:database:connectedDebugAndroidTest :app:connectedDebugAndroidTest
      - name: Upload storage reports and generated schemas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: credivaro-storage-api-${{ matrix.api }}
          path: |
            core/database/build/outputs/androidTest-results/
            core/database/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
            core/database/schemas/
          if-no-files-found: warn
          retention-days: 14
